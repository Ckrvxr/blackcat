<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blackcat engine smoke test</title>
    <style>
        html, body { min-height: 100%; background: #fff; color: #000; }
        #sample { padding: 24px; background: #fff; color: #000; }
    </style>
    <script>
        globalThis.blackcatRuntimeErrors = [];
        globalThis.blackcatPrepaintSeen = false;
        globalThis.blackcatPrepaintBeforeBody = false;
        globalThis.blackcatThemeReadySeen = false;
        document.addEventListener('blackcat:prepaint-installed', () => {
            blackcatPrepaintSeen = true;
            blackcatPrepaintBeforeBody = !document.body;
        }, {once: true});
        document.addEventListener('blackcat:theme-ready', () => { blackcatThemeReadySeen = true; }, {once: true});
        addEventListener('error', (event) => blackcatRuntimeErrors.push(event.message));
        addEventListener('unhandledrejection', (event) => blackcatRuntimeErrors.push(String(event.reason)));
        const requestedLanguage = new URLSearchParams(location.search).get('lang');
        if (requestedLanguage) Object.defineProperty(navigator, 'language', {value: requestedLanguage, configurable: true});
        const blackcatStore = new Map();
        const fixtureMode = new URLSearchParams(location.search);
        if (fixtureMode.get('disabled') === '1') {
            blackcatStore.set('blackcat.settings.v1', {enabled: false});
        } else if (fixtureMode.get('prepaint') === 'off') {
            blackcatStore.set('blackcat.settings.v1', {
                automation: {mode: 'time', activation: '00:00', deactivation: '00:00', behavior: 'OnOff'},
            });
        }
        globalThis.GM_getValue = (key, fallback) => blackcatStore.has(key) ? blackcatStore.get(key) : fallback;
        globalThis.blackcatStoredSettings = () => blackcatStore.get('blackcat.settings.v1');
        globalThis.GM_setValue = async (key, value) => {
            const delay = globalThis.blackcatStorageDelay || 0;
            if (delay) await new Promise((resolve) => setTimeout(resolve, delay));
            if (globalThis.blackcatStorageFailure) throw new Error('Test storage failure');
            blackcatStore.set(key, structuredClone(value));
        };
        const registeredMenuCommands = new Map();
        let nextMenuId = 0;
        globalThis.GM_registerMenuCommand = (label, callback) => {
            const id = ++nextMenuId;
            (globalThis.blackcatCommands ||= {})[label] = callback;
            registeredMenuCommands.set(id, label);
            return id;
        };
        globalThis.GM_unregisterMenuCommand = (id) => {
            const label = registeredMenuCommands.get(id);
            if (label) delete globalThis.blackcatCommands[label];
            registeredMenuCommands.delete(id);
        };
        let valueListener;
        globalThis.GM_addValueChangeListener = (_key, listener) => { valueListener = listener; return 1; };
        globalThis.blackcatRemoteSettings = (settings) => {
            blackcatStore.set('blackcat.settings.v1', settings);
            valueListener?.('blackcat.settings.v1', undefined, settings, true);
        };
    </script>
    <script src="/dist/blackcat.user.js"></script>
</head>
<body>
    <main id="sample">A bright page for Dark Reader injection testing.</main>
</body>
</html>
